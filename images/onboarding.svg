<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#f8fafc"/>
  <style>
    .title { font: bold 24px sans-serif; fill: #0f172a; }
    .box { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
    .label { font: 14px sans-serif; fill: #0f172a; }
  </style>
  <text x="20" y="40" class="title">Active Directory Onboarding (diagram)</text>
  <rect x="40" y="70" width="180" height="80" rx="8" class="box" />
  <text x="130" y="110" text-anchor="middle" class="label">HR</text>

  <rect x="310" y="70" width="180" height="80" rx="8" class="box" />
  <text x="400" y="110" text-anchor="middle" class="label">IT - Provisioning</text>

  <rect x="580" y="70" width="180" height="80" rx="8" class="box" />
  <text x="670" y="110" text-anchor="middle" class="label">User - First Login</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <line x1="220" y1="110" x2="310" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="490" y1="110" x2="580" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <text x="250" y="95" class="label">request</text>
  <text x="520" y="95" class="label">provision</text>
</svg>
